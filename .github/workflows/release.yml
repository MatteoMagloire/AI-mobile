name: Release

# Publier une version : git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est manquant (voir README, section Mises à jour)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilation et signature de l'APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersion="$VERSION" -PupdateRepo="$GITHUB_REPOSITORY"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AI-mobile-$VERSION.apk"
          cd dist
          sha256sum "AI-mobile-$VERSION.apk" > "AI-mobile-$VERSION.apk.sha256"
          cat "AI-mobile-$VERSION.apk.sha256"

      - name: Publication de la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
