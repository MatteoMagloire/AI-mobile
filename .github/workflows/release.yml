name: Release

# Publier une version : git tag v1.2.3 && git push origin v1.2.3,
# ou onglet Actions > Release > Run workflow avec le numéro de version.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.1.0)"
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est manquant (voir README, section Mises à jour)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilation et signature de l'APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease -PappVersion="$VERSION" -PupdateRepo="$GITHUB_REPOSITORY"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Axo-$VERSION.apk"
          cd dist
          sha256sum "Axo-$VERSION.apk" > "Axo-$VERSION.apk.sha256"
          cat "Axo-$VERSION.apk.sha256"

      # Les notes de .github/release-notes/<tag>.md s'affichent dans la fenêtre de mise à jour de l'app.
      - name: Publication de la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Axo $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Axo $TAG" --generate-notes
          fi
